<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тесты на двоих</title>
<meta name="description" content="Психологические тесты для пары: языки любви, привязанность, темперамент, стиль в конфликте и другие. Проходите по очереди и сравнивайте результаты.">
<meta property="og:type" content="website">
<meta property="og:title" content="Тесты на двоих">
<meta property="og:description" content="Психологические тесты для пары: языки любви, привязанность, темперамент, стиль в конфликте и другие. Проходите по очереди и сравнивайте результаты.">
<meta name="theme-color" content="#5b3fe0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b3fe0'/%3E%3Cpath d='M32 50C14 38 12 26 20 20c5-4 10-2 12 3 2-5 7-7 12-3 8 6 6 18-12 30z' fill='%23ff5a36'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: одна колонка как в тесте Белбина — огромный заголовок, вопросы списком, панель «Далее» внизу; результаты — рисунок «от руки» + разбор по вкладкам */
:root{
  --bg:#ffffff; --ink:#0b0a10; --soft:#55525f; --muted:#a3a0ad; --line:#e8e6ef;
  --track:#d8d2f8; --accent:#5b3fe0; --accent-ink:#ffffff; --accent-soft:#f0edff;
  --p1:#5b3fe0; --p2:#ff5a36; --p2-soft:#fff0eb; --bar:#ffffff; --shadow:rgba(30,15,80,.10); --card:#ffffff;
  --display:"Unbounded","Arial Black","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0d13; --ink:#f3f2f8; --soft:#b9b6c6; --muted:#6f6c7d; --line:#262430;
  --track:#3a3462; --accent:#8e7bff; --accent-ink:#0e0d13; --accent-soft:#1c1935;
  --p1:#8e7bff; --p2:#ff7a59; --p2-soft:#2b1913; --bar:#15141b; --shadow:rgba(0,0,0,.55); --card:#17161e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0d13; --ink:#f3f2f8; --soft:#b9b6c6; --muted:#6f6c7d; --line:#262430;
  --track:#3a3462; --accent:#8e7bff; --accent-ink:#0e0d13; --accent-soft:#1c1935;
  --p1:#8e7bff; --p2:#ff7a59; --p2-soft:#2b1913; --bar:#15141b; --shadow:rgba(0,0,0,.55); --card:#17161e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
#app.has-bar{padding-bottom:calc(var(--barh,150px) + 40px)}
#app{overflow-x:clip}
html{overflow-x:clip}
.view{animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
p{margin:0}
.kicker{font:800 clamp(17px,3.1vw,28px)/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0 0 6px}
h1{font:900 clamp(30px,8.4vw,84px)/.98 var(--display);text-transform:uppercase;margin:0 0 28px;text-wrap:balance;hyphens:auto;overflow-wrap:break-word}
h1.sm{font-size:clamp(26px,6vw,52px);margin-bottom:18px}
h1 .ch{display:inline-block;animation:drop .6s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*35ms)}
@keyframes drop{from{opacity:0;transform:translateY(-.4em) rotate(-8deg)}}
.lead{display:grid;gap:14px;max-width:66ch;font-size:18px}
.meta{color:var(--muted);font-weight:600;font-size:15px}
.note{font-size:14px;color:var(--soft)}
.back{background:none;border:0;padding:0;color:var(--soft);font-weight:600;font-size:15px;margin-bottom:22px;display:inline-flex;gap:6px}
.back:hover{color:var(--accent)}
.sec{font:800 clamp(18px,2.6vw,23px)/1.25 var(--body);text-transform:uppercase;letter-spacing:.01em;text-align:center;padding-bottom:10px;border-bottom:2px solid var(--accent);margin:36px 0 22px;text-wrap:balance}
.sec.left{text-align:left}
.partno{font:800 26px/1 var(--body);color:var(--muted);margin:40px 0 0}
.who{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--accent-soft);margin-bottom:14px}
.who.b{background:var(--p2-soft)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.dot.a{background:var(--p1)} .dot.b{background:var(--p2)}
.hint{color:var(--soft);font-size:15px}

/* кнопки */
.btn{border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);font:700 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:14px 22px;transition:transform .15s,opacity .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.97)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.b{background:var(--p2);color:#fff}
.btn.link{background:none;color:var(--soft);padding:14px 4px;letter-spacing:.04em}
.btn.sm{padding:10px 14px;font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:26px}

/* иллюстрации «от руки» */
.ill{display:block;width:100%;height:auto;overflow:visible}
.ill .bgc{fill:var(--ill-bg,var(--accent-soft));transform-origin:80px 84px;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
.ill .ln{fill:none;stroke:var(--ill,var(--ink));stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s cubic-bezier(.6,0,.2,1) forwards;animation-delay:calc(var(--i)*60ms + .15s)}
.ill .ln.th{stroke-width:7}
.ill .ln.sp{stroke-width:2.2}
.ill .fl{fill:var(--ill-acc,var(--accent));opacity:0;animation:fadein .6s ease forwards;animation-delay:.6s}
.ill .ilt{font:900 22px var(--display);fill:var(--ill,var(--ink));opacity:0;animation:fadein .4s ease forwards .9s}
.ill.stat .ln,.ill.stat .fl,.ill.stat .bgc,.ill.stat .ilt{animation:none;stroke-dashoffset:0;opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* главная */
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:30px 0 8px;max-width:620px}
.field{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line);padding:6px 0;transition:border-color .2s}
.field:focus-within{border-color:var(--accent)}
.field input{border:0;background:transparent;color:var(--ink);font:600 20px var(--body);width:100%;min-width:0;padding:6px 0;outline:none}
.field input::placeholder{color:var(--muted)}
.list{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:8px 18px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 0;width:100%}
.row .ill{width:64px;transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.row:hover .ill{transform:rotate(-6deg) scale(1.08)}
.row:hover .row-t{color:var(--accent)}
.row-t{font:800 clamp(17px,2.6vw,22px)/1.15 var(--display);text-transform:uppercase;transition:color .15s}
.row-d{color:var(--soft);font-size:16px;margin-top:6px;max-width:58ch}
.row-m{color:var(--muted);font-size:14px;font-weight:600;margin-top:6px}
.row-s{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:14px;font-weight:600;min-width:0}
.st{display:flex;align-items:center;gap:7px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.st.ok{color:var(--ink)}
.ring{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px var(--line)}
.st.ok .ring.a{background:var(--p1);box-shadow:none}.st.ok .ring.b{background:var(--p2);box-shadow:none}
.st.go .ring.a{box-shadow:inset 0 0 0 2px var(--p1)}.st.go .ring.b{box-shadow:inset 0 0 0 2px var(--p2)}
.tag-new{display:inline-block;font:800 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--p2);color:#fff;padding:4px 6px;border-radius:3px;vertical-align:middle;margin-left:8px;transform:translateY(-2px)}
@media (max-width:560px){.row{grid-template-columns:48px 1fr}.row .ill{width:48px;align-self:start}.row-s{grid-column:2;flex-direction:row;flex-wrap:wrap;gap:6px 16px}}
.cta{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:20px;margin-top:8px;text-align:left;border:0;width:100%}
.cta:hover .ill{transform:scale(1.06) rotate(4deg)}
.cta .ill{transition:transform .3s}
.cta-t{font:800 clamp(20px,3vw,28px)/1.1 var(--display);text-transform:uppercase}
@media (max-width:480px){.cta{grid-template-columns:80px 1fr;gap:14px}}
.prof{width:100%;border-collapse:collapse;font-size:15px}
.prof th,.prof td{text-align:left;padding:12px 10px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.prof th{font-weight:700;color:var(--soft);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.prof td:first-child{font-weight:700}
.prof tr[data-act]{cursor:pointer}.prof tr[data-act]:hover td:first-child{color:var(--accent)}
.scroll{overflow-x:auto}
.foot{margin-top:56px;color:var(--muted);font-size:14px;display:grid;gap:12px;max-width:66ch}

/* вступление */
.intro-top{display:grid;grid-template-columns:1fr 200px;gap:24px;align-items:start}
@media (max-width:640px){.intro-top{grid-template-columns:1fr}.intro-top .ill{max-width:150px}}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px;max-width:640px}
.pk{display:grid;gap:6px;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:6px;padding:18px;transition:border-color .15s,transform .15s}
.pk:hover{border-color:var(--p1);transform:translateY(-2px)}.pk.b:hover{border-color:var(--p2)}
.pk-n{display:flex;align-items:center;gap:10px;font:800 19px/1.2 var(--display);text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.pk-s{color:var(--soft);font-size:15px}

/* вопросы — общее */
.qs{display:grid;gap:34px}
.q{display:grid;gap:12px}
.q-t{font-size:17px}
.q-n{color:var(--soft)}
@keyframes popsel{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:popsel .3s ease}
.anch{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:13px;font-weight:600;max-width:440px}
.anch span:last-child{text-align:right}

/* ползунок */
.rng{padding-top:4px}
.rng input{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;display:block;--v:0%}
.rng input::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--accent) var(--v),var(--track) var(--v))}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-8px;border:0;box-shadow:0 0 0 5px var(--accent-soft);transition:transform .15s}
.rng input:active::-webkit-slider-thumb{transform:scale(1.3)}
.rng input::-moz-range-track{height:2px;background:var(--track)}
.rng input::-moz-range-progress{height:2px;background:var(--accent)}
.rng input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:0;box-shadow:0 0 0 5px var(--accent-soft)}
.ticks{display:flex;justify-content:space-between;padding:0 9px;margin-top:4px}
.ticks button{width:0;display:flex;justify-content:center;background:none;border:0;padding:4px 0;font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
.ticks button.on{color:var(--accent);font-weight:800}

/* ранжирование */
.rk{display:grid;gap:10px}
.rk-i{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:8px;padding:12px 16px;transition:border-color .15s,background .15s,transform .2s}
.rk-i:hover{border-color:var(--accent);transform:translateX(4px)}
.rk-b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2px dashed var(--track);font:900 16px var(--display);color:var(--accent-ink)}
.rk-i.on{border-color:var(--accent);background:var(--accent-soft)}
.rk-i.on .rk-b{background:var(--accent);border:0;animation:popsel .35s ease}
.rk-i.r1 .rk-b{background:var(--p2)}

/* кружки разного размера */
.dots{display:flex;align-items:center;gap:clamp(6px,2vw,14px);max-width:440px;justify-content:space-between}
.dt{width:var(--s);height:var(--s);flex:none;border-radius:50%;border:2.5px solid var(--c);background:transparent;padding:0;transition:background .15s,transform .15s}
.dt.neg{--c:var(--p2)}.dt.mid{--c:var(--muted)}.dt.pos{--c:var(--accent)}
.dt:hover{transform:scale(1.1)}
.dt.on{background:var(--c)}

/* смайлики */
.faces{display:flex;gap:clamp(6px,2vw,14px);max-width:440px;justify-content:space-between}
.fc{width:52px;height:52px;border:0;background:none;padding:0;border-radius:50%;transition:transform .15s}
.fc svg{width:100%;height:100%;display:block}
.fc circle.f{fill:var(--card);stroke:var(--muted);stroke-width:2.5;transition:fill .15s,stroke .15s}
.fc .fm{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
.fc .fe{fill:var(--muted)}
.fc:hover{transform:scale(1.1) rotate(-5deg)}
.fc.on circle.f{fill:var(--accent);stroke:var(--accent)}
.fc.on .fm{stroke:var(--accent-ink)}.fc.on .fe{fill:var(--accent-ink)}

/* сердечки */
.hearts{display:flex;gap:8px}
.hrt{width:46px;height:46px;border:0;background:none;padding:2px;transition:transform .15s}
.hrt svg{width:100%;height:100%;display:block}
.hrt path{fill:transparent;stroke:var(--p2);stroke-width:2.2;transition:fill .2s}
.hrt:hover{transform:scale(1.12)}
.hrt.on path{fill:var(--p2)}
.hrt.on{animation:popsel .35s ease both;animation-delay:calc(var(--k)*40ms)}

/* плитки 1–9 */
.tiles{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;max-width:460px}
.tl{aspect-ratio:1;max-width:100%;border:2px solid var(--line);background:var(--card);border-radius:6px;font:800 16px var(--body);font-variant-numeric:tabular-nums;padding:0;transition:background .15s,border-color .15s,transform .15s;color:var(--soft)}
.tl:hover{border-color:var(--accent);transform:translateY(-2px)}
.tl.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl.lo{background:var(--accent-soft);border-color:var(--track);color:var(--accent)}

/* это или то */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs-or{align-self:center;font:900 13px var(--display);color:var(--muted);text-transform:uppercase}
.vt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:16px;font-size:16px;line-height:1.4;transition:transform .2s,border-color .2s,background .2s,opacity .2s;display:grid;gap:8px;align-content:start}
.vt b{font:900 22px var(--display);color:var(--accent)}
.vt:hover{border-color:var(--accent);transform:translateY(-3px)}
.vt.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);transform:scale(1.02)}
.vt.on b{color:var(--accent-ink)}
.vt.off{opacity:.45}
@media (max-width:560px){.vs{grid-template-columns:1fr}.vs-or{justify-self:center}}

/* биполярная шкала */
.bp{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.bp-l{text-align:right;font-weight:600}.bp-r{font-weight:600}
.bps{display:flex;gap:10px;align-items:center}
.bp .opt{flex:none;padding:0;border-radius:50%;border:2.5px solid var(--line);background:var(--card);transition:background .15s,border-color .15s,transform .15s}
.bp .opt:hover{border-color:var(--accent);transform:scale(1.1)}
.bp .opt.on{background:var(--accent);border-color:var(--accent)}
.bp .s1,.bp .s5{width:40px;height:40px}.bp .s2,.bp .s4{width:31px;height:31px}.bp .s3{width:24px;height:24px}
@media (max-width:600px){.bp{grid-template-columns:1fr 1fr}.bp-l{text-align:left;order:1}.bp-r{text-align:right;order:2}.bps{order:3;grid-column:1/-1;justify-content:space-between;max-width:320px;width:100%;margin:0 auto}}

/* варианты-карточки */
.opts{display:grid;gap:8px;max-width:520px}
.op{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s,transform .15s}
.op-m{width:20px;height:20px;border-radius:50%;border:2px solid var(--track);transition:all .15s}
.op:hover{border-color:var(--accent);transform:translateX(3px)}
.op.on{border-color:var(--accent);background:var(--accent-soft)}
.op.on .op-m{border:6px solid var(--accent)}
/* шкала с подписями */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.sg{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;transition:all .15s}
.sg:hover{border-color:var(--accent)}
.sg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* да / может быть / нет */
.ynm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:440px}
.yb{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:11px 6px;font-weight:700;font-size:15px;transition:all .15s}
.yb.y:hover,.yb.y.on{border-color:var(--accent)}.yb.y.on{background:var(--accent);color:var(--accent-ink)}
.yb.m:hover,.yb.m.on{border-color:var(--muted)}.yb.m.on{background:var(--muted);color:var(--bg)}
.yb.n:hover,.yb.n.on{border-color:var(--p2)}.yb.n.on{background:var(--p2);color:#fff}
/* иконки разделов, рисунок пары, задание */
.ill.mini{width:44px;height:44px;flex:none;margin:-6px 0}
.hi{display:flex!important;align-items:center;gap:8px}
.pair-ill{display:flex;align-items:flex-start;justify-content:center;gap:10px;max-width:560px;margin:0 auto 28px}
.pair-ill figure{margin:0;flex:1 1 0;min-width:0;text-align:center;display:grid;gap:6px;justify-items:center}
.pair-ill .ill{max-width:190px}
.pair-ill figcaption{font-size:14px;color:var(--soft)}
.pair-ill figcaption b{display:block;color:var(--ink);font:800 15px/1.2 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.pair-plus{align-self:center;font:900 34px var(--display);color:var(--p2);margin-top:-30px}
.task{border:2px solid var(--accent);border-radius:12px;padding:18px;display:grid;gap:10px;background:var(--accent-soft);margin-top:26px;max-width:72ch}
.task.on{opacity:.7}
.chiplist{display:flex;flex-wrap:wrap;gap:8px}
.chiplist span{border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;background:var(--accent-soft)}
.chiplist.m span{background:var(--line)}
.sec-note{color:var(--soft);font-size:15px;margin:-10px 0 14px;max-width:66ch}

  summary:r=>c.levels[r.l].t,
  chart:sc=>legend(sc)+bars([{label:c.barLabel,sub:c.barSub,val:r=>({pct:(r.v-c.lo)/(c.hi-c.lo)*100,txt:c.fmt(r.v)})}].concat(c.extraBars||[]),sc),
  person(r){const o=c.levels[r.l];
   return{ill:ill(o.ill||c.icon),big:`<span data-count="${r.v}" data-dec="${c.dec||0}">${c.dec?r1(r.v):r.v}</span><small style="font-size:.38em;color:var(--muted)"> / ${c.hi}</small>`,title:o.t,tag:o.tag,

  pair(sc){const a=sc.a,b=sc.b;let h=a.l===b.l?`<p class="callout">У вас одинаковый результат — <b>${c.levels[a.l].t.toLowerCase()}</b>.</p>`:`<p class="callout">${esc(nm("a"))} — <b>${c.levels[a.l].t.toLowerCase()}</b>, ${esc(nm("b"))} — <b>${c.levels[b.l].t.toLowerCase()}</b>.</p>`;
   return h+(c.pairTip?c.pairTip(a,b):"")},
  sim:(a,b)=>clamp(100-Math.abs(a.v-b.v)/(c.hi-c.lo)*100,0,100)
 },c);
 return t}

const PVQ=[["SD","Для этого человека важно придумывать новое и быть творческим. Он любит делать всё по-своему, оригинально."],["PO","Ему важно быть богатым: иметь много денег и дорогие вещи."],["UN","Он считает важным, чтобы ко всем людям относились одинаково и у каждого были равные возможности."],["AC","Ему очень важно показывать свои способности. Он хочет, чтобы люди восхищались тем, что он делает."],["SE","Ему важно жить в безопасной обстановке. Он избегает всего, что может угрожать его безопасности."],["ST","Он любит сюрпризы и всегда ищет новые занятия. Считает, что в жизни важно попробовать много разного."],["CO","Он считает, что люди должны делать то, что им говорят, и всегда соблюдать правила — даже когда никто не видит."],["UN","Ему важно выслушивать людей, не похожих на него. Даже если он не согласен, он хочет их понять."],["TR","Ему важно быть скромным. Он старается не привлекать к себе внимания."],["HE","Ему важно хорошо проводить время. Он любит себя баловать."],["SD","Ему важно самому решать, что делать. Он любит свободу и не хочет зависеть от других."],["BE","Ему очень важно помогать окружающим. Он хочет заботиться об их благополучии."],["AC","Ему важно быть очень успешным. Он надеется, что люди признают его достижения."],["SE","Ему важно, чтобы государство защищало его от любых угроз. Он хочет, чтобы страна была сильной и могла защитить своих граждан."],["ST","Он ищет приключений и любит рисковать. Хочет, чтобы жизнь была захватывающей."],["CO","Ему важно всегда вести себя правильно. Он избегает всего, что люди сочли бы неправильным."],["PO","Ему важно, чтобы его уважали. Он хочет, чтобы люди делали то, что он говорит."],["BE","Ему важно быть верным друзьям. Он хочет посвящать себя близким людям."],["UN","Он уверен, что люди должны беречь природу. Забота об окружающей среде для него важна."],["TR","Для него важны традиции. Он старается следовать обычаям своей семьи или религии."],["HE","Он не упускает возможности повеселиться. Ему важно делать то, чт  id:"pvq",group:"life",format:"dots",icon:"compass",fmtLabel:"кружки-шкала",kicker:"Что для вас по-настоящему важно?",title:"Ценности",min:4,

 short:"Сила желания и его механизм: спонтанное (хочется «само») или отзывчивое (хочется, когда уже начали). Важно знать про себя и партнёра.",

 method:"<p>Канадский психиатр Розмари Бэссон (2000) описала два механизма желания: спонтанное, которое возникает до близости, и отзывчивое (responsive), которое появляется в ответ на прикосновения и атмосферу. Оба — норма. Вопросы составлены для этого сайта по описанию модели.</p><p>«Сила желания» — среднее 5 утверждений от 1 до 5. Механизм определяется по разнице между утверждениями об отзывчивом и спонтанном желании.</p>"};

const rint=n=>Math.floor(Math.random()*n);

function randAns(t,partner){const ans={};
 t.parts.forEach(p=>{const pf=p.fmt||t.format;
  if(pf==="points"){let left=10;const its=shuffle(p.items);its.forEach((it,i)=>{const v=i===its.length-1?left:rint(Math.min(left,6)+1);ans[it.id]=v;left-=v})}
  else if(pf==="rank")shuffle([0,1,2,3,4]).forEach((v,i)=>ans[p.items[i].id]=v);
  else p.items.forEach(it=>{
   if(pf==="vs")ans[it.id]=Math.random()<.5?"a":"b";
   else if(pf==="swipe")ans[it.id]=rint(2);
   else if(pf==="tiles")ans[it.id]=(t.scale.n||9)===9?3+rint(7):1+rint(t.scale.n);
   else if(pf==="options")ans[it.id]=rint(it.choices.length);
   else if(pf==="ynm")ans[it.id]=rint(3);
   else if(pf==="seg")ans[it.id]=t.scale.min+rint(t.scale.n);
   else if(pf==="faces")ans[it.id]=it.rev?1+rint(3):3+rint(3);
   else if(pf==="guess"){ans[it.id+"s"]=rint(4);ans[it.id+"g"]=partner&&Math.random()<.6?partner[it.id+"s"]:rint(4)}
   else ans[it.id]=1+rint(pf==="bipolar"||pf==="hearts"?5:t.scale.n)})});
 return ans}

const encV=v=>v===undefined?"-":v===10?"A":String(v);
const decV=c=>c==="-"?undefined:c==="A"?10:/\d/.test(c)?+c:c;
function exportCode(w){
 const parts=[];TESTS.forEach(t=>{const r=res(t,w);if(!r)return;let s="";flat(t).forEach(it=>{s+=it.opts?encV(r.ans[it.id+"s"])+encV(r.ans[it.id+"g"]):encV(r.ans[it.id])});parts.push(t.id+":"+s)});
 return parts.length?btoa("DUO1|"+encodeURIComponent(nm(w))+"|"+parts.join(",")):null}
function parseCode(code){
 try{const raw=atob(String(code).replace(/[^A-Za-z0-9+/=]/g,""));if(!raw.startsWith("DUO1|"))return null;
  const seg=raw.split("|"),out={name:decodeURIComponent(seg[1]||""),tests:{}};
  (seg[2]||"").split(",").forEach(x=>{const i=x.indexOf(":"),t=tById(x.slice(0,i)),s=x.slice(i+1);if(!t)return;const its=flat(t);
   if(s.length!==its.reduce((k,it)=>k+(it.opts?2:1),0))return;const ans={};let p=0;
   its.forEach(it=>{if(it.opts){const a=decV(s[p++]),b=decV(s[p++]);if(a!==undefined)ans[it.id+"s"]=a;if(b!==undefined)ans[it.id+"g"]=b}else{const v=decV(s[p++]);if(v!==undefined)ans[it.id]=v}});
   out.tests[t.id]=ans});
  return Object.keys(out.tests).length?out:null}catch(e){return null}}

 else if(pf==="tiles"){const tn=t.scale.n||9;h+=qt+`<div class="tiles" role="radiogroup" style="grid-template-columns:repeat(${tn},1fr);max-width:${tn*52}px">${[...Array(tn).keys()].map(k=>radio(it.id,k+1,v,"tl"+(v!==undefined&&k+1<v?" lo":""),k+1)).join("")}</div><div class="anch" style="max-width:460px"><span>${t.scale.lo}</span><span>${t.scale.hi}</span></div>`}

 h+=`<div class="tabp">`;
 const h0=h.length;
 if(ui.tab==="pair"){const s=simOf(t),tk=S.talk[t.id+"_task"];
   if(t.person){const pa=t.person(d.sc.a,"a",d.raw),pb=t.person(d.sc.b,"b",d.raw);
     h+=`<div class="pair-ill"><figure>${pa.ill}<figcaption><i class="dot a"></i> ${esc(nm("a"))}<b>${pa.title}</b></figcaption></figure><span class="pair-plus">+</span><figure>${pb.ill}<figcaption><i class="dot b"></i> ${esc(nm("b"))}<b>${pb.title}</b></figcaption></figure></div>`}
   else h+=`<div class="pair-ill"><figure>${ill(t.icon)}</figure></div>`;
   h+=`${t.needsBoth&&FACT[t.id]?`<div class="secs" style="margin-bottom:24px"><section class="w"><h3>Интересный факт</h3><p>${FACT[t.id]}</p></section></div>`:""}`;
   const taskB=TASK[t.id]?`<div class="task${tk?" on":""}"><h3>Задание на неделю</h3><p>${TASK[t.id]}</p><div><button class="btn sm${tk?" ghost":""}" data-act="task" data-test="${t.id}">${tk?"Выполнено ✓":"Отметить выполненным"}</button></div></div>`:"";
   ui._task=taskB;
   h+=`<div class="simm"><p class="simm-n"><span data-count="${s}">${s}</span>%</p><div><p class="simm-l">${t.needsBoth?"угадано вместе":"похожесть ваших ответов · "+simWord(s)}</p><div class="track big" style="margin-top:8px"><div class="fill pair" style="width:${clamp(s,2,100)}%"></div></div></div></div><div class="pair">${t.pair(d.sc,d.raw)}</div>${ui._task}
   <div class="blk" style="margin-top:30px;max-width:72ch"><h3>Вопросы для разговора</h3><p class="note" style="margin:6px 0 10px">Обсудите вдвоём и отмечайте, что уже обсудили.</p><div class="talk">${t.talk.map((q,i)=>{const on=S.talk[t.id]&&S.talk[t.id][i];return `<button class="tq${on?" on":""}" data-act="talk" data-test="${t.id}" data-i="${i}" aria-pressed="${!!on}"><span class="tq-c">${on?"✓":""}</span><span>${q}</span></button>`}).join("")}</div></div>
   ${t.needsBoth?"":`<div class="btns"><button class="btn" data-act="story" data-who="pair">Карточка для сторис</button></div>`}`}
 else{const w=ui.tab,p=t.person(d.sc[w],w,d.raw);
   h+=`<div class="rhero"><div class="rill">${p.ill}</div><div class="rhead ${w}"><p class="pc-n"><i class="dot ${w}"></i>${esc(nm(w))}</p>${p.big?`<p class="pc-big">${p.big}</p>`:""}<h2 class="res-t">${p.title}</h2><p class="res-tag">${p.tag}</p><button class="btn ghost sm" data-act="story" data-who="${w}">Карточка для сторис</button></div></div>${p.body}`;
   const key=t.key?t.key(d.sc[w]):null,show=SHOW[t.id]&&key!==null?SHOW[t.id][key]:null;
   if(show||FACT[t.id])h+=`<div class="secs" style="margin-top:28px">${show?`<section><h3>Как это проявляется</h3><ul class="plus">${li(show)}</ul></section>`:""}${FACT[t.id]?`<section><h3>Интересный факт</h3><p>${FACT[t.id]}</p></section>`:""}</div>`}
 h=h.slice(0,h0)+decorate(h.slice(h0));
 h+=`</div>${waitB}<div class="btns">${["a","b"].filter(w=>d.sc[w]).map(w=>`<button class="btn link" data-act="start" data-test="${t.id}" data-who="${w}">Пройти заново: ${esc(nm(w))}</button>`).join("")}<button class="btn ghost" data-act="home">К другим тестам</button></div>${method(t.method)}`;
 return h}

/* ================= итог пары ================= */
function summaryData(){const done=TESTS.filter(t=>both(t)&&!t.needsBoth).map(t=>({t,s:simOf(t),d:scores(t)}));const g=both(T_GUESS)?simOf(T_GUESS):null;return{done,g,avgS:done.length?Math.round(avg(done.map(x=>x.s))):null}}
function summaryHTML(){
 const {done,g,avgS}=summaryData();
 let h=`<button class="back" data-act="home">← Все тесты</button><p class="kicker">Итог пары</p><h1 class="sm">${esc(nm("a"))} + ${esc(nm("b"))}</h1>`;
 if(!done.length&&g===null)return h+`<p>Пройдите вдвоём хотя бы один тест, и здесь появится ваш общий портрет.</p>`;
 const word=avgS===null?"":avgS>=80?"Вы удивительно похожи: смотрите на многое одинаково и легко понимаете друг друга. Не забывайте только, что новизну в пару иногда приносят как раз различия.":avgS>=60?"У вас много общего, а различия скорее дополняют друг друга. Это хорошее сочетание: есть общая почва и есть чему учиться.":avgS>=40?"Вы во многом разные. Это повод узнавать и учиться друг у друга, а в трудные моменты — договариваться, а не переделывать.":"Вы очень разные люди. Различия не означают несовместимость, но требуют больше разговоров и договорённостей.";
 h+=`<div class="sum-hero">${ill("pair")}<div>${avgS!==null?`<p class="simm-l">средняя похожесть по ${done.length} ${plural(done.length,["тесту","тестам","тестам"])}</p><p class="pc-big" style="font-size:clamp(56px,12vw,104px)"><span data-count="${avgS}">${avgS}</span>%</p><p style="margin-top:10px;max-width:56ch">${word}</p>`:""}${g!==null?`<p style="margin-top:12px"><b>Знание друг друга в игре:</b> ${Math.round(g)}%</p>`:""}</div></div>`;
 if(done.length>1){const sorted=done.slice().sort((x,y)=>y.s-x.s);h+=`<div class="hl"><div><small>Больше всего совпадаете</small><b>${sorted[0].t.title}</b><span class="note">${sorted[0].s}% похожести</span></div><div><small>Больше всего различаетесь</small><b>${sorted[sorted.length-1].t.title}</b><span class="note">${sorted[sorted.length-1].s}% похожести</span></div></div>`}
 if(done.length)h+=`<h2 class="sec left">Тест за тестом</h2><div>${done.map(({t,s,d})=>`<button class="srow" data-act="result" data-test="${t.id}" data-tab="pair"><span class="srow-t">${t.title}</span><span><i class="dot a"></i> ${esc(t.summary(d.sc.a))}</span><span><i class="dot b"></i> ${esc(t.summary(d.sc.b))}</span><span class="sv">${s}%<span class="track"><span class="fill pair" style="display:block;width:${clamp(s,2,100)}%"></span></span></span></button>`).join("")}</div>`;
 const left=TESTS.filter(t=>!both(t));if(left.length)h+=`<p class="note" style="margin-top:18px">Ещё не пройдено вдвоём: ${left.map(t=>t.title).join(", ")}.</p>`;
 h+=`<div class="btns"><button class="btn" data-act="story" data-who="summary">Карточка для сторис</button></div><p class="note" style="margin-top:24px;max-width:66ch">Похожесть — это не совместимость. Исследования показывают, что сходство характеров слабо предсказывает счастье пары; гораздо важнее, как вы обращаетесь с различиями.</p>`;
 return h}

/* ================= карточка для сторис ================= */
function storyHTML(){
 const st=ui.story;let inner="";
 if(st==="summary"){const {done,g,avgS}=summaryData();const top=done.slice().sort((x,y)=>y.s-x.s);
   inner=`<p class="st-k">Итог пары</p><div class="st-ill">${ill("pair")}</div><div><p class="st-n">${esc(nm("a"))} + ${esc(nm("b"))}</p>${avgS!==null?`<p class="st-big">${avgS}%</p><p class="st-g">похожи по ${done.length} ${plural(done.length,["тесту","тестам","тестам"])}</p>`:""}${g!==null?`<p class="st-g">знаем друг друга на ${Math.round(g)}%</p>`:""}</div><div class="st-two">${top.slice(0,3).map(x=>`<div><b>${x.t.title}</b> · ${x.s}%</div>`).join("")}</div>`}
 else{const t=tById(ui.test),d=scores(t);
   if(st==="pair"){const s=simOf(t);inner=`<p class="st-k">${t.title}</p><div><p class="st-n">${esc(nm("a"))} + ${esc(nm("b"))}</p><p class="st-big">${s}%</p><p class="st-g">похожесть · ${simWord(s)}</p></div><div class="st-two">${["a","b"].map(w=>{const p=t.person?t.person(d.sc[w],w,d.raw):null;return `<div><p class="st-n">${esc(nm(w))}</p><p class="st-t" style="font-size:clamp(16px,3vh,26px)">${p?p.title:esc(t.summary(d.sc[w]))}</p></div>`}).join("")}</div>`}
   else{const p=t.person(d.sc[st],st,d.raw);inner=`<p class="st-k">${t.title}</p><div class="st-ill">${p.ill}</div><div><p class="st-n">${esc(nm(st))}</p>${p.big?`<p class="st-big">${p.big}</p>`:""}<p class="st-t">${p.title}</p><p class="st-g" style="margin-top:8px">${p.tag}</p></div>`}}
 return `<div class="ov" role="dialog" aria-label="Карточка для сторис"><button class="ov-bg" data-act="story-close" aria-label="Закрыть"></button><div class="story">${inner}<p class="st-f"><span>Тесты на двоих</span><span>♥</span></p></div><div class="ov-b"><span>Сделайте скриншот экрана</span><button class="btn sm" data-act="story-close">Закрыть</button></div></div>`}

/* ================= эффекты ================= */
function countUp(){if(RM)return;app.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,dec=+el.dataset.dec||0,t0=performance.now(),D=900;const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3),v=to*e;el.textContent=dec?r1(v):Math.round(v);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function confetti(){if(RM)return;const fx=document.getElementById("fx"),cols=["var(--p1)","var(--p2)","var(--accent)"],chars=["♥","♥","✦","●"];
 for(let i=0;i<46;i++){const s=document.createElement("span");s.textContent=chars[i%4];s.style.left=Math.random()*100+"vw";s.style.color=cols[i%3];s.style.fontSize=(14+Math.random()*18)+"px";fx.appendChild(s);
  const dx=(Math.random()-.5)*200,rot=(Math.random()-.5)*720,dur=1600+Math.random()*1400;
  s.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${dx}px,${innerHeight+60}px) rotate(${rot}deg)`,opacity:.9}],{duration:dur,delay:Math.random()*400,easing:"cubic-bezier(.3,.6,.5,1)",fill:"forwards"}).onfinish=()=>s.remove()}}

/* ================= отрисовка ================= */
/* место под нижней панелью = её настоящая высота (на телефоне она бывает в две строки) */
let barH=150,barRO=null;
function watchBar(){const bar=app.querySelector(".bar");if(!bar)return;
 const set=()=>{barH=bar.offsetHeight;app.style.setProperty("--barh",barH+"px")};set();
 if(window.ResizeObserver){if(barRO)barRO.disconnect();barRO=new ResizeObserver(set);barRO.observe(bar)}}
function fit(){document.querySelectorAll(".res-t,.st-t,#app h1,.done-h").forEach(el=>{el.style.fontSize="";let fs=parseFloat(getComputedStyle(el).fontSize),n=0;while(el.scrollWidth>el.clientWidth+1&&fs>13&&n++<60){fs-=1;el.style.fontSize=fs+"px"}})}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(fit,150)});
function render(){
 const t=ui.test?tById(ui.test):null;const isQ=ui.view==="quiz"&&t&&!one(t);app.classList.toggle("has-bar",isQ);
 let h="";
 if(ui.view==="home")h=homeHTML();
 else if(ui.view==="intro")h=introHTML(t);
 else if(ui.view==="quiz")h=one(t)?oneHTML(t):quizHTML(t);
 else if(ui.view==="done")h=doneHTML(t);
 else if(ui.view==="result")h=resultHTML(t);
 else if(ui.view==="summary")h=summaryHTML();
 const anim=ui.view!=="quiz"||!one(t);
 // нижнюю панель держим вне анимированного блока: анимация transform «привязывает» position:fixed к блоку, а не к экрану
 let barHTML="";const bi=h.indexOf('<div class="bar">');if(bi>=0){barHTML=h.slice(bi);h=h.slice(0,bi)}
 app.innerHTML=(DEMO&&ui.view!=="quiz"?demoBar():"")+`<div class="${anim&&!ui.noAnim?"view":""}">${h}</div>`+barHTML+(ui.story?storyHTML():"")+(ui.sync?syncHTML():"");
 ui.noAnim=false;
 if(isQ){updBar();watchBar()}
 fit();countUp();
 if(ui.celebrate){ui.celebrate=false;setTimeout(confetti,250)}
}
const parseV=s=>/^-?\d+$/.test(s)?+s:s;

app.addEventListener("click",e=>{
 const el=e.target.closest("[data-act],[data-set],[data-tick],[data-rank],[data-one]");if(!el)return;
 if(el.hasAttribute("data-set")){
  const id=el.dataset.set,v=parseV(el.dataset.v);ui.ans[id]=v;const q=el.closest(".q");
  q.querySelectorAll(`[data-set="${id}"]`).forEach(b=>{const bv=parseV(b.dataset.v);let on=bv===v;
   if(b.classList.contains("hrt"))on=bv<=v;
   b.classList.toggle("on",on);b.setAttribute("aria-checked",bv===v);
   if(b.classList.contains("tl"))b.classList.toggle("lo",bv<v);
   if(b.classList.contains("vt"))b.classList.toggle("off",bv!==v)});
  if(!el.classList.contains("hrt")&&!el.classList.contains("vt")){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
  if(el.classList.contains("hrt"))q.querySelectorAll(".hrt.on").forEach(b=>{b.style.animation="none";void b.offsetWidth;b.style.animation=""});
  saveDraft();updBar();
  const t=tById(ui.test),items=t.parts[ui.part].items,curIt=items.find(x=>x.id===q.dataset.q);
  if(curIt&&ansOK(curIt)){const nx=q.nextElementSibling;if(nx){const nIt=items.find(x=>x.id===nx.dataset.q);if(nIt&&!ansOK(nIt)){const r=nx.getBoundingClientRect();if(r.bottom>innerHeight-barH-20)nx.scrollIntoView({block:"center",behavior:RM?"auto":"smooth"})}}}
  return}
 if(el.hasAttribute("data-tick")){setPoints(document.getElementById("r-"+el.dataset.tick),+el.dataset.v);return}
 if(el.hasAttribute("data-rank")){const t=tById(ui.test),p=t.parts[ui.part],id=el.dataset.rank;
  if(ui.ans[id]!==undefined)delete ui.ans[id];
  else{const used=p.items.filter(it=>ui.ans[it.id]!==undefined).map(it=>5-ui.ans[it.id]);let r=1;while(used.includes(r))r++;ui.ans[id]=5-r;
   const rest=p.items.filter(it=>ui.ans[it.id]===undefined);if(rest.length===1){const u2=p.items.filter(it=>ui.ans[it.id]!==undefined).map(it=>5-ui.ans[it.id]);let r2=1;while(u2.includes(r2))r2++;ui.ans[rest[0].id]=5-r2}}
  p.items.forEach(it=>{const b=app.querySelector(`[data-rank="${it.id}"]`),r=ui.ans[it.id]===undefined?null:5-ui.ans[it.id];b.className="rk-i"+(r?" on r"+r:"");b.querySelector(".rk-b").textContent=r||""});
  saveDraft();updBar();return}
 if(el.hasAttribute("data-one")){oneAnswer(+el.dataset.one,-1);return}
 const act=el.dataset.act,tid=el.dataset.test;
 if(act==="home")go({view:"home",test:null,confirmReset:false,story:null});
 else if(act==="intro")go({view:"intro",test:tid,story:null});
 else if(act==="result")go({view:"result",test:tid,tab:el.dataset.tab||null,story:null});
 else if(act==="summary")go({view:"summary",story:null});
 else if(act==="start"){const w=el.dataset.who,t=tById(tid),d=draft(t,w);go({view:"quiz",test:tid,who:w,part:d?Math.min(d.part||0,t.parts.length-1):0,idx:d?Math.min(d.idx||0,count(t)-1):0,ans:d?JSON.parse(JSON.stringify(d.ans)):{},story:null})}
 else if(act==="prev"){ui.part--;saveDraft();go({})}
 else if(act==="next"){const t=tById(ui.test);if(!barState(t).ok)return;if(ui.part<t.parts.length-1){ui.part++;saveDraft();go({})}else finish()}
 else if(act==="one-prev"){if(ui.idx>0){ui.idx--;saveDraft();go({},true)}}
 else if(act==="sw"){const v=+el.dataset.v;oneAnswer(v,v?1:-1)}
 else if(act==="rank-reset"){const p=tById(ui.test).parts[ui.part];p.items.forEach(it=>delete ui.ans[it.id]);saveDraft();go({noAnim:true},true)}
 else if(act==="tab")go({tab:el.dataset.tab,noAnim:true},true);
 else if(act==="talk"){S.talk[tid]=S.talk[tid]||{};S.talk[tid][el.dataset.i]=!S.talk[tid][el.dataset.i];save();const on=S.talk[tid][el.dataset.i];el.classList.toggle("on",on);el.setAttribute("aria-pressed",on);el.querySelector(".tq-c").textContent=on?"✓":""}
 else if(act==="story")go({story:el.dataset.who,noAnim:true},true);
 else if(act==="story-close")go({story:null,noAnim:true},true);
 else if(act==="task"){const k=tid+"_task";S.talk[k]=!S.talk[k];save();go({noAnim:true},true)}
 else if(act==="sync-out")go({sync:{step:"export-pick"},noAnim:true},true);
 else if(act==="sync-in")go({sync:{step:"import-paste"},noAnim:true},true);
 else if(act==="sync-exp"){const code=exportCode(el.dataset.who);if(code)go({sync:{step:"export-show",code},noAnim:true},true)}
 else if(act==="sync-copy"){const ta=document.getElementById("sync-code"),m=document.getElementById("copy-msg");
  const fallback=()=>{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);m.textContent="Код выделен — скопируйте его вручную"};
  try{navigator.clipboard.writeText(ta.value).then(()=>{m.textContent="Скопировано ✓"},fallback)}catch(err){fallback()}}
 else if(act==="sync-read"){const val=document.getElementById("sync-in").value,p=parseCode(val);
  if(p)go({sync:{step:"import-pick",parsed:p},noAnim:true},true);
  else go({sync:{step:"import-paste",val,msg:val.trim()?"Код не распознан. Скопируйте его целиком, без лишнего текста, и попробуйте ещё раз.":"Сначала вставьте код."},noAnim:true},true)}
 else if(act==="sync-apply"){const w=el.dataset.who,p=ui.sync.parsed;Object.keys(p.tests).forEach(id=>{S.res[id]=S.res[id]||{};S.res[id][w]={ans:p.tests[id],date:Date.now(),imported:true}});if(p.name)S.names[w]=p.name;save();
  const n=Object.keys(p.tests).length;go({view:"home",sync:null,test:null,story:null,flash:`Ответы ${esc(p.name||nm(w))} добавлены: ${n} ${plural(n,["тест","теста","тестов"])}. Открывайте тесты, где вы прошли оба, — результаты уже сложились.`})}
 else if(act==="sync-close")go({sync:null,noAnim:true},true);
 else if(act==="demo-on"){enterDemo();go({view:"home",confirmReset:false})}
 else if(act==="demo-reroll"){const keep=ui.view;exitDemo();enterDemo();go({view:keep==="quiz"||keep==="done"?"home":keep,story:null})}
 else if(act==="demo-off"){exitDemo();go({view:"home",test:null,story:null})}
 else if(act==="demo-fill"){const t=tById(ui.test),p=res(t,oth(ui.who));ui.ans=randAns(t,p&&p.ans);finish()}
 else if(act==="reset")go({confirmReset:true,noAnim:true},true);
 else if(act==="reset-no")go({confirmReset:false,noAnim:true},true);
 else if(act==="reset-yes"){S={names:{a:"",b:""},res:{},drafts:{},talk:{}};save();go({view:"home",confirmReset:false})}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(ui.story||ui.sync))go({story:null,sync:null,noAnim:true},true)});
function setPoints(inp,v){
 const t=tById(ui.test),p=t.parts[ui.part],id=inp.dataset.pt;
 const others=p.items.reduce((s,it)=>s+(it.id===id?0:(+ui.ans[it.id]||0)),0);
 v=clamp(v,0,10-others);inp.value=v;inp.style.setProperty("--v",(v*10)+"%");ui.ans[id]=v;
 inp.parentNode.querySelectorAll("[data-tick]").forEach(b=>b.classList.toggle("on",+b.dataset.v===v));
 saveDraft();updBar()}
app.addEventListener("input",e=>{const el=e.target;
 if(el.hasAttribute("data-pt"))setPoints(el,+el.value);
 else if(el.hasAttribute("data-nm")){const w=el.dataset.nm;S.names[w]=el.value;save();app.querySelectorAll(`[data-name="${w}"]`).forEach(s=>s.textContent=nm(w))}});
render();
})();
</script>
</body>
</html>
